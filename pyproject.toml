[project]
name = "fake-news-verifier"
version = "0.3.0"
description = "Evidence-based fake news verifier: FastAPI + LangGraph + Claude + PostgreSQL + AngularJS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",      # includes uvicorn and the FastAPI Cloud CLI (fastapi deploy)
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "anthropic>=0.40",
    "langgraph>=0.2",
    "httpx>=0.27",
    "trafilatura>=1.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
