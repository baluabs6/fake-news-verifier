name: Ingest fact-checks

on:
  schedule:
    - cron: "30 1 * * *"        # 07:00 IST daily (GitHub cron is UTC and may start a few minutes late)
  workflow_dispatch:
    inputs:
      since_days:
        description: "Only consider items newer than this many days"
        default: "3"
      refresh:
        description: "Re-fetch URLs already stored (picks up revised ratings)"
        type: boolean
        default: false

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INGEST_USER_AGENT: ${{ vars.INGEST_USER_AGENT }}
          SINCE_DAYS: ${{ inputs.since_days || '3' }}
          REFRESH: ${{ inputs.refresh && '--refresh' || '' }}
        run: python -m ingest.run --since-days "$SINCE_DAYS" $REFRESH
